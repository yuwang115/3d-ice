name: Draft JOSS PDF

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - paper.md
      - paper.bib
      - .github/workflows/draft-pdf.yml
  pull_request:
    branches: [main]
    paths:
      - paper.md
      - paper.bib
      - .github/workflows/draft-pdf.yml

permissions:
  contents: read

jobs:
  paper:
    name: Build paper draft
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build draft PDF
        uses: openjournals/openjournals-draft-action@master
        with:
          journal: joss
          paper-path: paper.md

      - name: Upload paper artifact
        uses: actions/upload-artifact@v4
        with:
          name: joss-paper
          path: paper.pdf
