[project]
name = "3d-ice"
version = "0.1.2"
description = "Interactive 3D Cryosphere Explorer for Antarctica and Greenland"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Yu Wang", email = "yu.wang0@utas.edu.au" },
]
dependencies = [
    "h5py>=3.10",
    "matplotlib>=3.8",
    "netCDF4>=1.6",
    "numpy>=1.26",
    "pillow>=10.0",
    "pyshp>=2.3",
    "tifffile>=2025.1",
]

[project.urls]
Homepage = "https://3d-ice.com/"
Repository = "https://github.com/yuwang115/3d-ice"
Issues = "https://github.com/yuwang115/3d-ice/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pyyaml>=6.0",
]
e2e = [
    "pytest>=8.0",
    "playwright>=1.40",
    "pytest-playwright>=0.5",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = []

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: Unit tests for pure functions",
    "integration: Integration tests requiring data files",
    "e2e: End-to-end browser tests",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]
